services:
  worker:
    build:
      context: .
      dockerfile: backend-worker/Dockerfile
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090}
    volumes:
      - dental_worker_data:/data
    ports:
      - "${BACKEND_PORT:-8010}:8787"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_APP_BRAND_NAME: ${VITE_APP_BRAND_NAME:-Dental Manager}
        VITE_APP_BRAND_SHORT_NAME: ${VITE_APP_BRAND_SHORT_NAME:-Dental}
    depends_on:
      - worker
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    restart: unless-stopped

volumes:
  dental_worker_data:
