services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/dental_manager.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ALLOW_DATABASE_REFRESH: ${ALLOW_DATABASE_REFRESH:-true}
    volumes:
      - dental_data:/app/data
      - dental_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  dental_data:
  dental_uploads:
