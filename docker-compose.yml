services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/dental_manager.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8090}
      ALLOW_DATABASE_REFRESH: ${ALLOW_DATABASE_REFRESH:-true}
    volumes:
      - ./data:/app/data
      - dental_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_APP_BRAND_NAME: ${VITE_APP_BRAND_NAME:-Dental Manager}
        VITE_APP_BRAND_SHORT_NAME: ${VITE_APP_BRAND_SHORT_NAME:-Dental}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8090}:80"

volumes:
  dental_uploads:
