name: Deploy Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-worker.yml"
      - "backend-worker/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/export-sqlite-to-d1.py"
  workflow_dispatch:

concurrency:
  group: deploy-worker-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy dental-manager-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix backend-worker

      - name: Typecheck Worker
        run: npm --prefix backend-worker run typecheck

      - name: Test Worker
        run: npm --prefix backend-worker run test

      - name: Apply D1 migrations
        run: npm --prefix backend-worker run d1:migrate:remote

      - name: Deploy Worker
        run: npm --prefix backend-worker run deploy
